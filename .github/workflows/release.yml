name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: ia-tools-linux-x86_64
            asset_name: ia-tools-linux-x86_64
          - os: macos-latest
            artifact_name: ia-tools-macos
            asset_name: ia-tools-macos
          - os: windows-latest
            artifact_name: ia-tools.exe
            asset_name: ia-tools-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ia-tools \
            --collect-all qtawesome \
            --collect-all json5 \
            --add-data "config_managers:config_managers" \
            --add-data "models:models" \
            --add-data "ui:ui" \
            app.py

      - name: Prepare binary artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/ia-tools dist/${{ matrix.artifact_name }}

      - name: Prepare binary artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item dist\ia-tools.exe dist\${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ia-tools-linux-x86_64/*
            ia-tools-macos/*
            ia-tools-windows.exe/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
