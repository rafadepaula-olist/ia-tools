name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: ia-tools-linux-x86_64
            asset_name: ia-tools-linux-x86_64
          - os: macos-latest
            artifact_name: ia-tools-macos
            asset_name: ia-tools-macos
          - os: windows-latest
            artifact_name: ia-tools-windows.exe
            asset_name: ia-tools-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ia-tools \
            --collect-all qtawesome \
            --collect-all json5 \
            --add-data "assets:assets" \
            app.py
          mv dist/ia-tools dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Build Standalone Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ia-tools `
            --collect-all qtawesome `
            --collect-all json5 `
            --add-data "assets;assets" `
            app.py
          Move-Item dist\ia-tools.exe dist\${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238604da99376a6fb63 # v2.2.1
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
